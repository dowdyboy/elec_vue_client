<!doctype html>
<html lang="zh-CN">
  <!-- 闪屏页：纯静态页面（无框架），由 features/splash.ts 加载 -->
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: linear-gradient(135deg, #1e3a8a 0%, #2f7ef7 100%);
        color: #fff;
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .logo {
        font-size: 56px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .sub {
        font-size: 13px;
        opacity: 0.8;
      }
      .loader {
        width: 120px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      .loader::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #fff;
        animation: slide 1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="logo">⚡</div>
    <div class="title">Electron 教学与模板</div>
    <div class="sub">正在加载应用...</div>
    <div class="loader"></div>
  </body>
</html>
