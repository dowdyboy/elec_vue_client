name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 静态质量 + 构建（Windows 与开发机一致）──
  quality:
    name: Quality (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 质量/构建不需要 Electron 二进制与原生模块 ABI，跳过 postinstall 加速并降低环境依赖
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run build:signal
      - run: npm run check:signal
      - run: node scripts/check-signal-package.mjs --pack

  # ── 真实 Electron 端到端（隐藏窗口，不依赖桌面会话）──
  e2e:
    name: Electron E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 一次构建供 11 套 Electron E2E 复用；smoke 需要 playground 构建
      - run: npm run build
      - run: npm run build:playground
      - run: node scripts/run-source-ipc-e2e.mjs
      - run: node scripts/run-source-preview-e2e.mjs
      - run: node scripts/run-signal-pages-e2e.mjs
      - run: node scripts/run-signal-demo-e2e.mjs
      - run: node scripts/run-gnuradio-e2e.mjs
      - run: node scripts/run-gnuradio-split-e2e.mjs
      - run: node scripts/run-gnuradio-dualch-e2e.mjs
      - run: node scripts/run-dual-sim-e2e.mjs
      - run: node scripts/run-raw-playback-e2e.mjs
      - run: node scripts/run-section-sweep.mjs
      - run: node scripts/run-smoke.mjs
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: playground/dist/smoke.png
          if-no-files-found: ignore

  # ── 像素级视觉回归（Canvas2D / WebGL2 双基线，覆盖全部 10 个组件）──
  # 单独成 job：只依赖 playground 构建 + 两张基线图，失败信息比混在 e2e 里清楚。
  # 目前 continue-on-error（先看 CI 上的稳定性）；确认稳定后删掉该行即为门禁。
  # 绘制层有意改动时：本地 `npm run test:visual:update` 重新生成基线并提交。
  visual:
    name: Pixel regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:visual
      - name: Upload actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-actual
          path: playground/dist/visual-*.png
          if-no-files-found: ignore

  # ── Linux：覆盖率 + 生产构建（不跑 Electron，避免 headless GPU 差异）──
  linux:
    name: Coverage + build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
