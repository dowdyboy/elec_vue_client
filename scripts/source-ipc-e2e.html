<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'"
    />
    <title>source ipc e2e</title>
  </head>
  <body>
    <div id="app">source ipc e2e</div>
    <script>
      window.__sourceFrames = []
      window.__analysisFrames = []
      window.__sweepFrames = []
      window.api.source.onFrame((f) => {
        if (window.__sourceFrames.length < 20) window.__sourceFrames.push(f)
      })
      window.api.signalAnalysis.onFrame((f) => {
        if (window.__analysisFrames.length < 40) window.__analysisFrames.push(f)
      })
      window.api.sweep.onFrame((f) => window.__sweepFrames.push(f))
    </script>
  </body>
</html>
