# ────────────────────────────────────────────────────────────────
# 发布前必须替换的项（当前为占位/演示值，直接打包会得到"能装但不能更新"的产物）：
#   appId        → 注册到系统的唯一应用 ID，改为自己的反向域名
#   publish.url  → 真实更新服务器（当前 example.com 必然 404；
#                  docs/15-自动更新.md 把"检查失败"当作教学的一部分，
#                  但正式发布必须换成自己的地址或改用 provider: github）
#   linux.maintainer → deb/AppImage 包的维护者邮箱
# ────────────────────────────────────────────────────────────────
appId: com.dowdyboy.elec-vue-client
productName: elec_vue_client
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!tools/**'
  - '!docs/**'
  - '!scripts/**'
  - '!playground/**'
  - '!coverage/**'
  - '!dist-signal/**'
  - '!out/test/**'
  - '!DEVLOG.md'
asarUnpack:
  - resources/**
extraResources:
  - from: tools/gnuradio
    to: gnuradio
    filter:
      - '**/*.py'
      - '**/*.md'
win:
  executableName: elec_vue_client
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: dowdyboy <dowdyboy@users.noreply.github.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# 原生模块（better-sqlite3）由 postinstall 的 `electron-builder install-app-deps` 重建；
# 这里保持 false 以免安装依赖时重复编译。
npmRebuild: false
publish:
  provider: generic
  # ⚠ 占位地址：正式发布前替换为自己的更新服务器（或整体改为 provider: github）
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
